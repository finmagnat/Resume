name: Validate hand-polished CV releases
on:
  push:
    branches: [fix/cv-bold-format-and-qa-20261101]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check "python-docx==1.2.0" "pypdf==6.1.0"
      - name: Read-only CV QA
        run: python tools/check_cv_release_format.py
      - name: Install isolated preview converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-liberation fonts-dejavu-core
      - name: Regenerate safe non-release preview
        run: |
          python -m py_compile tools/build_cv_releases.py
          python tools/build_cv_releases.py
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          for lang in ("EN", "RU", "UA"):
              folder=Path(".artifacts/cv-preview")/lang
              files=list(folder.glob("*.docx"))
              assert len(files)==1, (lang,files)
              doc=Document(files[0])
              entries=[p for p in doc.paragraphs if p.text.startswith("Unity Development:") or p.text.startswith("Architecture & Engineering Practices:")]
              assert len(entries)==2, (lang,len(entries))
              for p in entries:
                  chars=sum(len(r.text.strip()) for r in p.runs)
                  bold=sum(len(r.text.strip()) for r in p.runs if r.bold)
                  ratio=bold/max(chars,1)
                  print(f"GENERATOR {lang} {p.text.split(':')[0]} bold_ratio={ratio:.2f}")
                  assert ratio<.60, (lang,p.text[:50],ratio)
              pdf=list(folder.glob("*.pdf"))
              assert len(pdf)==1 and len(PdfReader(str(pdf[0])).pages) >= 2
          print("Generator QA passed without editing Releases")
          PY
