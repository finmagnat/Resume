name: Request portfolio CV rebuild

on:
  push:
    branches: [master]
    paths:
      - Releases/EN/Yuriy_Kobylyatskiy_Senior_Unity_Developer_EN.pdf
      - Releases/RU/Yuriy_Kobylyatskiy_Senior_Unity_Developer_RU.pdf

permissions:
  contents: read

concurrency:
  group: notify-portfolio-cv
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'finmagnat/Resume'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Request portfolio rebuild
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: node tools/notify_portfolio_cv.mjs
